<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speculative prefill · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    .svg-wrap { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · pipecat-speculative-prefill</p>
    <h1>The KV cache is warm before you finish speaking</h1>
    <p class="subtitle">final transcription arrives, first token in 317 ms &mdash; not 1,156 ms (Qwen2.5-0.5B, CPU fp32)</p>

    <div class="svg-wrap">
    <svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="speculative-prefill-flow-title speculative-prefill-flow-desc">
      <title id="speculative-prefill-flow-title">Speculative prefill: warm KV cache while the user speaks</title>
      <desc id="speculative-prefill-flow-desc">Sequence diagram of pipecat-speculative-prefill: interim transcriptions prefill the KV cache while the user speaks; the final transcription triggers generation from the warm cache and the first token reaches TTS in 317 ms.</desc>
      <defs>
        <!-- Dot grid background -->
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>

        <!-- Arrow markers -->
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <!-- Open arrowhead: async fire-and-forget only -->
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <!-- Background: paper + dot grid -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- =================================================================
           LIFELINES — centers: User 136, STT 380, Service 640, TTS 868
           ================================================================= -->
      <line x1="136" y1="128" x2="136" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="128" x2="380" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="128" x2="640" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="868" y1="128" x2="868" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- =================================================================
           COMBINED FRAGMENT: loop [while the user is still speaking]
           Spans User..Service (x 124..652)
           ================================================================= -->
      <rect x="124" y="168" width="528" height="224" rx="4"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="124" y="168" width="48" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="148" y="180" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle"
            letter-spacing="0.12em">LOOP</text>
      <text x="132" y="196" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" letter-spacing="0.04em">[while the user is still speaking]</text>

      <!-- =================================================================
           ACTIVATION BARS — drawn before arrows so arrows land on edges.
           ================================================================= -->
      <!-- STT: receives speech at y=240, emits final at y=436 -->
      <rect x="376" y="236" width="8" height="204" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- Service: first partial at y=296, emits first token at y=496 -->
      <rect x="636" y="292" width="8" height="208" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <!-- TTS: receives first token at y=496, returns audio at y=548 -->
      <rect x="864" y="492" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- =================================================================
           MESSAGE ARROWS — time flows top-down.
           ================================================================= -->

      <!-- M1: User -> STT (async speech stream, dashed open) -->
      <line x1="136" y1="240" x2="376" y2="240" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- M2: STT -> Service (async interim frame, dashed open) -->
      <line x1="384" y1="296" x2="636" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- M3: Service self-message (prefill delta, solid U-loop) -->
      <path d="M 644 296 L 684 296 L 684 328 L 644 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M4: STT -> Service (async interim frame, dashed open) -->
      <line x1="384" y1="356" x2="636" y2="356" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

      <!-- M5: STT -> Service (final transcription, sync call) -->
      <line x1="384" y1="436" x2="636" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- M6: Service -> TTS (headline: first token, coral) -->
      <line x1="644" y1="496" x2="864" y2="496" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- M7: TTS -> User (return, dashed filled) -->
      <line x1="864" y1="548" x2="136" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- =================================================================
           CALLOUT — editorial aside, empty right-margin zone.
           ================================================================= -->
      <text x="770" y="204" fill="#2d3142" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="middle">prefill the delta,</text>
      <text x="770" y="222" fill="#2d3142" font-size="14" font-style="italic"
            font-family="'Instrument Serif', serif" text-anchor="middle">while you still talk</text>
      <path d="M 770 232 Q 756 268 744 302" fill="none"
            stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="744" cy="302" r="2" fill="#2d3142"/>

      <!-- =================================================================
           MESSAGE LABELS — opaque paper masks, 6px+ gap from strokes.
           ================================================================= -->

      <!-- M1 label -->
      <rect x="228" y="222" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPEAKS</text>

      <!-- M2 label -->
      <rect x="470" y="278" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTERIM 1</text>

      <!-- M3 label (right of self-loop) -->
      <rect x="692" y="308" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREFILL DELTA</text>

      <!-- M4 label -->
      <rect x="470" y="338" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="348" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INTERIM 2</text>

      <!-- M5 label -->
      <rect x="464" y="418" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINAL TEXT</text>

      <!-- M6 label (coral · headline) -->
      <rect x="680" y="478" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="754" y="488" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIRST TOKEN · 317 MS</text>

      <!-- M7 label -->
      <rect x="452" y="532" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="542" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPLY AUDIO</text>

      <!-- =================================================================
           ACTOR BOXES — drawn after arrows/labels.
           ================================================================= -->

      <!-- Actor 1: User (external / soft) -->
      <rect x="56" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="72" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="78" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="136" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
      <text x="136" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speaks</text>

      <!-- Actor 2: STT (input) -->
      <rect x="300" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="308" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="324" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASR</text>
      <text x="380" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Whisper STT</text>
      <text x="380" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">streaming partials</text>

      <!-- Actor 3: SpeculativeLLMService (focal / coral) -->
      <rect x="560" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="72" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="568" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="584" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="640" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SpeculativeLLMService</text>
      <text x="640" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">KV cache · in-process</text>

      <!-- Actor 4: TTS (output) -->
      <rect x="788" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="788" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="796" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="810" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="868" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TTS</text>
      <text x="868" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speaks the reply</text>

      <!-- =================================================================
           LEGEND — horizontal strip at the bottom.
           ================================================================= -->
      <line x1="56" y1="592" x2="944" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <!-- Item 1: Focal actor swatch (coral) -->
      <rect x="56" y="618" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="76" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal service</text>

      <!-- Item 2: Activation bar swatch -->
      <rect x="200" y="614" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="212" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

      <!-- Item 3: Streaming frame (async, dashed open) -->
      <line x1="320" y1="624" x2="348" y2="624" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="356" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Streaming frame</text>

      <!-- Item 4: Call / work (solid muted) -->
      <line x1="490" y1="624" x2="518" y2="624" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="526" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call / work</text>

      <!-- Item 5: First token (coral headline) -->
      <line x1="636" y1="624" x2="664" y2="624" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="672" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">First token</text>

      <!-- Item 6: Reply (return, dashed filled) -->
      <line x1="786" y1="624" x2="814" y2="624" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="822" y="626" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reply</text>

    </svg>
    </div>
  </div>
</body>
</html>
