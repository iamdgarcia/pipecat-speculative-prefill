[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-speculative-prefill"
version = "0.1.1"
description = "Speculative KV-cache prefill for pipecat: prefill the LLM while the user is still talking, so generation starts the instant the final transcription arrives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Garcia Peña", email = "info@iamdgarcia.com" }]
keywords = ["pipecat", "voice", "llm", "kv-cache", "prefill", "latency", "speculative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pipecat-ai>=1.0.0"]

[project.optional-dependencies]
transformers = ["torch>=2.3", "transformers>=4.41"]
dev = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/iamdgarcia/pipecat-speculative-prefill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
